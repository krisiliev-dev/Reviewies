<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reviewies</title>
    <meta name="description" content="Track TV and film, and react to moments together." />
    <!-- Dark by default, and not as a preference: this gets used in a dark room with
         the television on. Declaring it stops iOS painting a white status bar over it. -->
    <meta name="theme-color" content="#0b0b0f" />
    <meta name="color-scheme" content="dark" />
    <!-- iOS reads this rather than the manifest when the app is added to the home
         screen, which is the install path that matters here. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Reviewies" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
