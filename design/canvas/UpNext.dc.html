<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&family=Archivo+Narrow:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
  <style>
    body { margin: 0; background: #131114; }
    a { color: #F0A93B; } a:hover { color: #D9A521; }
    .an { font-family: 'Archivo Narrow', 'Helvetica Neue', sans-serif; }
    .ar { font-family: 'Archivo', 'Helvetica Neue', sans-serif; }
    .pm { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    .eyebrow { font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 11px; line-height: 14px;
               letter-spacing: 0.10em; text-transform: uppercase; color: #918780; }
    .ring { width: 44px; height: 44px; flex-shrink: 0; border: none; background: none; padding: 0;
            cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .strike { position: absolute; left: 0; top: 52%; height: 1.5px; background: #918780;
              transition: width 220ms ease-out; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #131114; display: flex; flex-direction: column;
            overflow: hidden;">

  <div style="padding: 20px 16px 0;">
    <div class="an" style="font-weight: 700; font-size: 30px; line-height: 34px; color: #F4EFE7;">Up Next</div>
    <div class="pm" style="font-size: 13px; line-height: 16px; color: #918780; margin-top: 6px;">
      264 watches · 12 tracked · 5.5 days
    </div>
  </div>

  <div style="flex-grow: 1; overflow: hidden; margin-top: 22px;">
    <sc-for list="{{sections}}" as="sec" hint-placeholder-count="2">
      <div style="display: flex; align-items: center; gap: 12px; padding: 0 16px; margin-bottom: 10px;">
        <span class="eyebrow">{{sec.name}}</span>
        <span style="flex-grow: 1; height: 1px; background: #332E36;"></span>
      </div>

      <sc-for list="{{sec.rows}}" as="row" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px;
                    border-bottom: 1px solid #332E36;">

          <div style="width: 40px; height: 60px; flex-shrink: 0; border-radius: 2px; overflow: hidden;
                      background: #1C191E; border: 1px solid #332E36; display: flex; flex-direction: column;">
            <div style="height: 6px; background: {{row.band}};"></div>
            <div style="flex-grow: 1; display: flex; align-items: center; padding: 3px;">
              <span class="an" style="font-weight: 700; font-size: 9px; line-height: 10px; color: #F4EFE7;
                           overflow: hidden;">{{row.short}}</span>
            </div>
          </div>

          <div style="flex-grow: 1; min-width: 0;">
            <div style="position: relative; display: inline-block; max-width: 100%;">
              <span class="an" style="font-weight: 600; font-size: 17px; line-height: 22px;
                           color: {{row.titleColour}}; display: block;">{{row.title}}</span>
              <span class="strike" style="width: {{row.strikeWidth}};"></span>
            </div>
            <div class="pm" style="font-size: 13px; line-height: 16px; color: #918780; margin-top: 2px;">
              {{row.meta}}
            </div>
          </div>

          <button class="ring" onClick="{{row.toggle}}" aria-label="{{row.label}}">
            <sc-if value="{{row.done}}" hint-placeholder-val="{{false}}">
              <span style="width: 26px; height: 26px; border-radius: 50%; background: #F0A93B;
                           display: flex; align-items: center; justify-content: center;">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#131114"
                     stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 12.5 L9.5 18 L20 6.5"/></svg>
              </span>
            </sc-if>
            <sc-if value="{{row.open}}" hint-placeholder-val="{{true}}">
              <span style="width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid #4A434E;
                           display: block;"></span>
            </sc-if>
          </button>
        </div>
      </sc-for>
    </sc-for>
  </div>

  <sc-if value="{{showUndo}}" hint-placeholder-val="{{true}}">
    <div style="margin: 0 16px 10px; padding: 10px 14px; background: #1C191E; border: 1px solid #332E36;
                border-radius: 2px; display: flex; align-items: center; justify-content: space-between;">
      <span class="ar" style="font-size: 13px; line-height: 18px; color: #B3A9A0;">Marked {{undoName}}</span>
      <button onClick="{{undo}}" class="pm" style="background: none; border: 1px solid #4A434E;
              border-radius: 2px; color: #F0A93B; font-size: 13px; padding: 6px 12px; cursor: pointer;
              letter-spacing: 0.08em;">UNDO</button>
    </div>
  </sc-if>

  <div style="height: 64px; background: #0C0B0D; border-top: 1px solid #332E36; display: flex;
              align-items: stretch;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center;
                justify-content: center; gap: 3px; border-top: 3px solid #F0A93B; margin-top: -1px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F0A93B" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round"><path d="M4 4 L20 12 L4 20 Z"/></svg>
      <span class="ar" style="font-size: 11px; font-weight: 500; color: #F0A93B;">Up Next</span>
      <span class="pm" style="position: absolute; margin: -34px 0 0 30px; font-size: 11px; color: #131114;
            background: #F0A93B; border-radius: 8px; padding: 1px 5px;">7</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center;
                justify-content: center; gap: 3px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#918780" stroke-width="1.8"
           stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 L21 21"/></svg>
      <span class="ar" style="font-size: 11px; font-weight: 500; color: #918780;">Search</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center;
                justify-content: center; gap: 3px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#918780" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="1"/>
           <path d="M8 21 L16 21"/></svg>
      <span class="ar" style="font-size: 11px; font-weight: 500; color: #918780;">Library</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center;
                justify-content: center; gap: 3px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#918780" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round"><path d="M6 3 L18 3 L18 21 L12 16 L6 21 Z"/></svg>
      <span class="ar" style="font-size: 11px; font-weight: 500; color: #918780;">Watchlist</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center;
                justify-content: center; gap: 3px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#918780" stroke-width="1.8"
           stroke-linecap="round"><path d="M4 7 L20 7"/><path d="M4 12 L20 12"/><path d="M4 17 L20 17"/></svg>
      <span class="ar" style="font-size: 11px; font-weight: 500; color: #918780;">More</span>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"reduceMotion":{"editor":"boolean","default":false,"section":"Behaviour"}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { done: { hcf2: true }, undoName: null };
  }

  rows() {
    return [
      { section: 'Tonight', items: [
        { id: 'bear', title: 'The Bear', short: 'THE BEAR', band: '#C97A3E', meta: 'S03E04 · 31m · aired today' },
        { id: 'hcf2', title: 'Halt and Catch Fire', short: 'HALT AND CATCH FIRE', band: '#3E9EA8', meta: 'S02E07 · 47m' },
      ] },
      { section: 'Nearly done', items: [
        { id: 'chern', title: 'Chernobyl', short: 'CHERNOBYL', band: '#77808C', meta: 'S01E05 · 72m · last one' },
        { id: 'frier', title: 'Frieren', short: 'FRIEREN', band: '#B65C93', meta: 'S01E27 · 24m · 1 left' },
      ] },
      { section: 'Waiting since July', items: [
        { id: 'left', title: 'The Leftovers', short: 'THE LEFTOVERS', band: '#4A6FB0', meta: 'S02E03 · 58m · 4 months' },
      ] },
    ];
  }

  mark(id, title) {
    const done = { ...this.state.done };
    done[id] = true;
    this.setState({ done, undoName: title });
  }

  renderVals() {
    const done = this.state.done;
    const sections = this.rows().map((s) => ({
      name: s.section,
      rows: s.items.map((r) => {
        const isDone = !!done[r.id];
        return {
          ...r,
          done: isDone,
          open: !isDone,
          titleColour: isDone ? '#918780' : '#F4EFE7',
          strikeWidth: isDone ? '100%' : '0%',
          label: isDone ? 'Mark ' + r.title + ' unwatched' : 'Mark ' + r.title + ' watched',
          toggle: () => this.mark(r.id, r.title),
        };
      }),
    }));
    return {
      sections,
      showUndo: !!this.state.undoName,
      undoName: this.state.undoName || '',
      undo: () => {
        const done = { ...this.state.done };
        Object.keys(done).forEach((k) => { if (k !== 'hcf2') delete done[k]; });
        this.setState({ done, undoName: null });
      },
    };
  }
}
</script>
</body>
</html>
