<meta charset="utf-8">
<title>Reviewies extension</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 34rem; margin: 3rem auto; padding: 0 1rem; }
  input { width: 100%; padding: .6rem; font: inherit; }
  button { margin-top: .75rem; padding: .6rem 1.2rem; font: inherit; }
  .note { color: #666; font-size: .9em; }
</style>
<h1>Reviewies</h1>
<p>Where should playback updates be sent?</p>
<label>Relay URL<input id="url" type="url" placeholder="https://your-reviewies-instance/api/playback"></label>
<button id="save">Save</button>
<p id="status" class="note"></p>
<p class="note">Leave blank to disable sending. The extension only ever reads the title and playback position of the video you are watching.</p>
<script src="options.js"></script>
